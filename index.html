<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="เค้กออนไลน์ — เค้กโทนพาสเทล สั่งง่ายผ่าน LINE @cakeonline" />
  <title>เค้กออนไลน์ | Cake Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Pastel Palette: Pink / Purple / Blue / White / Yellow */
      --bg: #fff8fd;
      --paper: #ffffff;
      --ink: #3a2a2f;
      --muted: rgba(58,42,47,.72);

      --pink-100: #ffd6ef;
      --pink-200: #ffb8e3;

      --purple-100: #e5d9ff;
      --purple-200: #cbb7ff;

      --blue-100: #cfe8ff;
      --blue-200: #a9d4ff;

      --yellow-100: #fff7da;
      --yellow-200: #fff1a8;

      --shadow-soft: 0 10px 24px rgba(22,12,16,.08);
      --shadow-main: 0 18px 40px rgba(22,12,16,.10);

      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;

      --container: 1120px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: var(--bg);
      color:var(--ink);
      font-family: "Kanit", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height:1.55;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button,input{font:inherit}

    .container{
      max-width:var(--container);
      margin:0 auto;
      padding:0 18px;
    }

    /* Big pastel background strokes (reference vibe) */
    .bg-swoosh{
      position: fixed;
      inset: -12% -10% auto -10%;
      height: 64vh;
      z-index: -3;
      pointer-events:none;
      background:
        radial-gradient(900px 420px at 12% 10%, rgba(255,184,227,.65), transparent 60%),
        radial-gradient(900px 420px at 88% 20%, rgba(203,183,255,.55), transparent 60%),
        radial-gradient(900px 420px at 70% 88%, rgba(169,212,255,.45), transparent 62%),
        radial-gradient(900px 420px at 18% 95%, rgba(255,241,168,.35), transparent 62%);
      filter: blur(2px);
    }
    .bg-strokes{
      position: fixed;
      inset: -10% -10% -10% -10%;
      z-index:-4;
      pointer-events:none;
      background:
        radial-gradient(circle at 8% 18%, rgba(255,184,227,.18), transparent 38%),
        radial-gradient(circle at 92% 16%, rgba(203,183,255,.16), transparent 38%),
        radial-gradient(circle at 86% 86%, rgba(169,212,255,.15), transparent 40%),
        radial-gradient(circle at 10% 88%, rgba(255,241,168,.12), transparent 40%);
    }

    /* Top announcement */
    .announce{
      background: linear-gradient(90deg, rgba(255,184,227,.70), rgba(203,183,255,.55), rgba(169,212,255,.55), rgba(255,241,168,.45));
      border-bottom: 1px solid rgba(58,42,47,.08);
      backdrop-filter: blur(10px);
      position:sticky; top:0; z-index:60;
    }
    .announce .bar{
      display:flex; gap:10px; align-items:center; justify-content:center;
      padding:10px 0;
      color:rgba(58,42,47,.86);
      font-size:14px;
      flex-wrap:wrap;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.70);
      border:1px solid rgba(58,42,47,.08);
      box-shadow: 0 8px 20px rgba(22,12,16,.06);
    }

    /* Header */
    header{
      position:sticky; top:44px; z-index:55;
      background: rgba(255,255,255,.60);
      border-bottom:1px solid rgba(58,42,47,.08);
      backdrop-filter: blur(12px);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 0;
      gap:12px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      min-width: 240px;
    }
    .logo{
      width:44px; height:44px; border-radius:14px;
      background:
        radial-gradient(circle at 30% 30%, #fff, rgba(255,184,227,.9) 55%, rgba(203,183,255,.65)),
        radial-gradient(circle at 80% 90%, rgba(169,212,255,.55), transparent 55%);
      border:1px solid rgba(58,42,47,.08);
      box-shadow: var(--shadow-soft);
      position:relative;
      overflow:hidden;
    }
    .logo:after{
      content:"";
      position:absolute; inset:-20%;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0) 0 10px, rgba(255,255,255,.35) 10px 20px);
      transform: rotate(10deg);
    }
    .brand h1{ margin:0; font-size:18px; line-height:1.05; letter-spacing:.2px; }
    .brand small{ display:block; margin-top:3px; color:var(--muted); font-weight:300; }

    nav ul{
      margin:0; padding:0; list-style:none;
      display:flex; gap:10px; align-items:center; justify-content:center;
    }
    nav a{
      display:inline-flex; align-items:center;
      padding:10px 12px;
      border-radius:999px;
      font-size:14px;
      color:rgba(58,42,47,.85);
      border:1px solid transparent;
      transition:.2s ease;
      white-space:nowrap;
    }
    nav a:hover{
      background: rgba(255,255,255,.78);
      border-color: rgba(58,42,47,.08);
      transform: translateY(-1px);
    }

    .actions{ display:flex; gap:10px; align-items:center; justify-content:flex-end; min-width:240px; }
    .btn{
      border:0;
      cursor:pointer;
      border-radius:999px;
      padding:10px 14px;
      font-weight:700;
      box-shadow: var(--shadow-soft);
      transition:.18s ease;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
    }
    .btn:active{transform: translateY(1px)}
    .btn-primary{
      background: linear-gradient(135deg, var(--pink-200), var(--purple-100), var(--blue-100));
      color:#2c1d22;
      border:1px solid rgba(58,42,47,.10);
    }
    .btn-line{
      background: linear-gradient(135deg, rgba(255,241,168,.90), rgba(255,184,227,.70));
      border:1px solid rgba(58,42,47,.10);
      color:#2c1d22;
    }
    .btn-ghost{
      background: rgba(255,255,255,.72);
      border:1px solid rgba(58,42,47,.10);
      color: rgba(58,42,47,.88);
    }
    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      min-width:22px; height:22px;
      padding:0 7px;
      border-radius:999px;
      font-size:12px;
      background: rgba(255,255,255,.90);
      border:1px solid rgba(58,42,47,.10);
    }

    /* Sections + scallop */
    section{ padding: 24px 0; }
    .scallop{ --c: rgba(255,255,255,.92); position:relative; height:44px; margin: 14px 0 0; }
    .scallop:before{
      content:"";
      position:absolute; left:0; right:0; top:-1px; height:46px;
      background: radial-gradient(circle at 22px 0, var(--c) 21px, transparent 22px) 0 0/44px 44px repeat-x;
      filter: drop-shadow(0 10px 18px rgba(22,12,16,.06));
    }
    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }
    .section-head h3{
      margin:0;
      font-size:22px;
      letter-spacing:.2px;
      font-family:"Fredoka","Kanit",sans-serif;
    }
    .section-head p{ margin:0; color:var(--muted); font-size:14px; }

    /* Hero */
    .hero{ padding:36px 0 10px; }
    .hero
